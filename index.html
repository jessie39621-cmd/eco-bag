<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>環保小幫手 - 減塑成就</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f7f4;
            color: #2c3e50;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .card {
            background: white;
            max-width: 420px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #27ae60;
            font-size: 22px;
            margin-top: 0;
        }
        .counter-badge {
            background: #e8f8f5;
            color: #16a085;
            display: inline-block;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            min-height: 70px;
            color: #34495e;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
            transition: background 0.2s;
        }
        button:active {
            transform: scale(0.98);
            background-color: #219653;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌱 減塑新生活</h1>
        <div class="counter-badge">已累計使用次數：<span id="count">0</span> 次</div>
        <p id="display-text">感應 NFC，接收今日份的環保小肯定！</p>
        <button onclick="triggerEcoAction()">點擊模擬感應</button>
    </div>

    <script>
        // 50 句簡短且適度的環保稱讚標語
        const messages = [
            "此次購物未用塑膠袋，很棒！",
            "用了環保袋，今天很有型！",
            "環保小尖兵就是你！",
            "今天也是愛地球的好寶寶。",
            "太棒了，拒絕了一次性塑膠！",
            "環保魂大爆發，給你一個讚！",
            "簡約時尚，非你的環保袋莫屬。",
            "地球媽媽向你投遞一個微笑。",
            "隨手環保，生活更美好。",
            "又為海洋少製造一個負擔！",
            "這波減塑操作，滿分！",
            "今天沒有塑膠袋，心情真好。",
            "好習慣養成中，繼續保持！",
            "環保新時尚，你走在最前端。",
            "小小的舉動，大大的溫柔。",
            "拒絕塑膠袋，帥氣滿分。",
            "謝謝你對地球的貼心照顧。",
            "環保不只是口號，你做到了！",
            "帶著環保袋出門的你特別好看。",
            "今天解鎖減塑小成就！",
            "綠色生活，從自備袋子開始。",
            "給地球多一點呼吸的空間。",
            "低碳環保，由你帶頭示範。",
            "太厲害了，完美避開塑膠袋！",
            "你的環保袋散發著耀眼光芒。",
            "今天又為地球減輕負擔啦！",
            "拒絕拿塑膠袋的樣子超帥的。",
            "環保小達人上線，做得好！",
            "把溫柔留給大自然，好樣的。",
            "擁有環保袋的你，生活很有質感。",
            "減少一個塑膠袋，多一分美麗。",
            "今天也是守護地球的一天。",
            "這就是愛護地球的日常浪漫。",
            "為你的環保意識按個讚！",
            "環保日常，從容又優雅。",
            "今天也是減塑行動派！",
            "謝謝你讓地球少一點負擔。",
            "帶環保袋出門的你最棒了。",
            "小小的環保袋，大大的愛心。",
            "今天表現優異，環保小尖兵！",
            "保護地球，有你有我。",
            "每一次自備，都是一次溫柔對待。",
            "為你的綠色生活喝采！",
            "今天超自律，沒用塑膠袋耶！",
            "環保好習慣，今天也穩穩達標。",
            "把永續穿在身上，真好看。",
            "為地球多想一步，你真貼心。",
            "簡單的小動作，巨大的心意。",
            "今天也是優秀的環保行動家！",
            "環保袋萬歲，今天辛苦啦！"
        ];

        // 讀取計數
        let totalCount = localStorage.getItem('eco_count') || 0;
        document.getElementById('count').innerText = totalCount;

        // 紀錄點擊的時間戳記
        let touchTimestamps = JSON.parse(localStorage.getItem('touch_times') || '[]');

        function triggerEcoAction() {
            window.speechSynthesis.cancel();

            const now = Date.now();
            // 過濾並只保留最近 8 秒（8000 毫秒）內的觸碰紀錄
            touchTimestamps = touchTimestamps.filter(time => now - time < 8000);
            // 記錄本次觸碰
            touchTimestamps.push(now);
            localStorage.setItem('touch_times', JSON.stringify(touchTimestamps));

            let selectedText = "";

            // 判斷：若在 8 秒內點擊/感應次數達 3 次或以上
            if (touchTimestamps.length >= 3) {
                selectedText = "我們提倡減塑，不提倡玩環保袋耶～";
            } else {
                // 未滿 3 次，正常隨機抽一句，並將有效減塑次數 +1
                const randomIndex = Math.floor(Math.random() * messages.length);
                selectedText = messages[randomIndex];

                totalCount++;
                localStorage.setItem('eco_count', totalCount);
                document.getElementById('count').innerText = totalCount;
            }

            // 更新畫面顯示文字
            document.getElementById('display-text').innerText = selectedText;

            // 精準朗讀一次
            const utterance = new SpeechSynthesisUtterance(selectedText);
            utterance.lang = 'zh-TW';
            utterance.rate = 1.0;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        // 頁面載入後自動觸發（對應 NFC 感應開啟網頁）
        window.onload = function() {
            setTimeout(triggerEcoAction, 600);
        };
    </script>

</body>
</html>
